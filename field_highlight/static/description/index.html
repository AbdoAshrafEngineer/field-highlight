<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Support | Odoo Expert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f7fa;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        section {
            padding: 100px 0;
        }
        .contact-section {
            background: linear-gradient(135deg, #f8f5f9 0%, #f0e9f2 100%);
            text-align: center;
        }
        h1 {
            color: #6B2D5C;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: 18px;
            color: #444;
            max-width: 520px;
            margin: 0 auto 50px;
            line-height: 1.6;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 18px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .btn-linkedin {
            background-color: #0077b5;
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }
        .btn i {
            font-size: 28px;
        }
    </style>
</head>
<body>

    <section class="contact-section">
        <div class="container">
            
            <h1>Contact & Support</h1>
            
            <p class="subtitle">
                Professional Odoo implementation, custom development,<br>
                and expert technical consulting.
            </p>
            
            <div class="buttons">
                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/abdelrahman-ashraf-ahmed-ahmed/" 
                   target="_blank" 
                   class="btn btn-linkedin">
                    <i class="fa fa-linkedin"></i>
                    LinkedIn
                </a>
                
                <!-- WhatsApp -->
                <a href="https://wa.me/201003943683" 
                   target="_blank" 
                   class="btn btn-whatsapp">
                    <i class="fa fa-whatsapp"></i>
                    WhatsApp
                </a>
            </div>

        </div>
    </section>

</body>
</html>
